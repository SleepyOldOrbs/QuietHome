name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        shell: pwsh
        run: |
          sdkmanager "platforms;android-35" "build-tools;37.0.0"
          if ($LASTEXITCODE) { throw "Android SDK installation failed" }
      - name: Test shuffle and saved state
        shell: pwsh
        run: ./test.ps1
      - name: Build and verify APK
        shell: pwsh
        run: ./build.ps1
